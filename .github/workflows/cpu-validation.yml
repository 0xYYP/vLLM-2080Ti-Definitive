name: CPU validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install CPU validation tools
        run: python -m pip install --disable-pip-version-check "pytest==8.3.5" "ruff==0.9.10"
      - name: Run Bash 5 shell contracts
        run: |
          mkdir -p ci-logs
          set -o pipefail
          {
            bash --version
            [[ ${BASH_VERSINFO[0]} -ge 5 ]]
            bash -n build.sh launcher.sh tools/validate_profiles.sh tools/evaluate_fast_modes.sh
            bash tools/validate_profiles.sh
            pytest -q tests/2080ti/test_launcher_profile_contract.py
          } 2>&1 | tee ci-logs/shell-contracts.log
      - name: Upload shell contract logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-shell-contracts-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore

  python-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install CPU validation tools
        run: python -m pip install --disable-pip-version-check "pytest==8.3.5" "ruff==0.9.10"
      - name: Resolve validation commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            validation_base=$PR_BASE_SHA
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            # Only use the push "before" SHA when it is still reachable in
            # this checkout.  After a force push the previous head is
            # rewritten away, so falling back to HEAD^ keeps the diff base
            # valid instead of failing the whole run.
            validation_base=$PUSH_BEFORE_SHA
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            validation_base=$(git rev-parse HEAD^)
          else
            validation_base=$(git rev-parse HEAD)
          fi
          git cat-file -e "$validation_base^{commit}"
          printf 'VALIDATION_BASE=%s\n' "$validation_base" >> "$GITHUB_ENV"
      - name: Run isolated policy tests and static gates
        run: |
          mkdir -p .venv/bin ci-logs
          ln -sf "$(command -v python)" .venv/bin/python
          mapfile -t changed_python_files < <(
            git diff --name-only --diff-filter=ACMR \
              "$VALIDATION_BASE...HEAD" -- '*.py'
          )
          set -o pipefail
          {
            pytest -q tests/2080ti/test_sm75_attention_trace.py tests/2080ti/test_sm75_attention_planner.py tests/2080ti/test_sm75_int8kv_integration.py tests/2080ti/test_sm75_turboquant_integration.py tests/2080ti/test_sm75_spec_sync_integration.py tests/2080ti/test_launcher_profile_contract.py tests/2080ti/test_benchmark_manifest.py tests/2080ti/test_cpu_validation_workflow.py
            if ((${#changed_python_files[@]})); then
              ruff check --select E9,F,I "${changed_python_files[@]}"
              python -m py_compile "${changed_python_files[@]}"
            fi
            git diff --check "$VALIDATION_BASE...HEAD"
          } 2>&1 | tee ci-logs/python-policy-tests.log
      - name: Upload Python policy logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-python-policy-tests-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore
