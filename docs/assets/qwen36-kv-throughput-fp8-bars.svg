<rect class="bar4k" x="1096" y="285.1" width="24" height="164.9" rx="4"><title>MTP3 TQK8V4 PP4096/TG128: 1614.6 tok/s</title></rect>
<rect class="bar64k" x="1130" y="324.2" width="24" height="125.8" rx="4"><title>MTP3 TQK8V4 PP65536/TG512: 1231.7 tok/s</title></rect>
<text class="label" x="1130" y="474" text-anchor="middle">TQK8V4</text>
<rect class="bar4k" x="1240" y="286.3" width="24" height="163.7" rx="4"><title>MTP3 TQ4NC PP4096/TG128: 1602.8 tok/s</title></rect>
<rect class="bar64k" x="1274" y="324.7" width="24" height="125.3" rx="4"><title>MTP3 TQ4NC PP65536/TG512: 1227.2 tok/s</title></rect>
<text class="label" x="1274" y="474" text-anchor="middle">TQ4NC</text>
<line class="split" x1="733.0" y1="236" x2="733.0" y2="486"/>

