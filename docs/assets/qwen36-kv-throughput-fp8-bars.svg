<text class="mode" x="768" y="254">MTP3</text>
<rect class="bar4k" x="808" y="285.2" width="24" height="164.8" rx="4"><title>MTP3 FP16 PP4096/TG128: 1614.1 tok/s</title></rect>
<rect class="bar64k" x="842" y="322.0" width="24" height="128.0" rx="4"><title>MTP3 FP16 PP65536/TG512: 1253.9 tok/s</title></rect>
<text class="label" x="842" y="474" text-anchor="middle">FP16</text>
<rect class="bar4k" x="952" y="285.6" width="24" height="164.4" rx="4"><title>MTP3 INT8 PP4096/TG128: 1609.9 tok/s</title></rect>
<rect class="bar64k" x="986" y="324.6" width="24" height="125.4" rx="4"><title>MTP3 INT8 PP65536/TG512: 1227.9 tok/s</title></rect>
