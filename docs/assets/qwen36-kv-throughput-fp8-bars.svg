  <rect class="bar64k" x="548" y="144" width="32" height="20" rx="5"/>
  <text class="legend" x="594" y="160">PP65536/TG512: long input + long output</text>
  <text class="small" x="1080" y="160">Each KV group has two adjacent bars.</text>

