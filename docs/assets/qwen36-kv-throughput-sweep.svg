<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.6 27B KV throughput sweep on dual RTX 2080 Ti</title>
  <desc id="desc">A visual matrix comparing FP8 and GPTQ-INT4 checkpoint routes, FP16, INT8, TQK8V4, and TQ4NC KV precision, noMTP and MTP3 modes, and PP4096/TG128 versus PP65536/TG512 throughput.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 1; }
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #141a24; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f5c6f; }
      .section { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162033; }
      .hdr { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243044; }
      .label { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2a3d; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667386; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7a8494; }
      .cellText { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .cellSub { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f5c6f; }
      .note { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #364255; }
      .grid { stroke: #dfe4ee; stroke-width: 1; }
      .routeBand { fill: #f0f4ff; stroke: #cbd6ee; stroke-width: 1; }
      .kvBand { fill: #f6f8fc; }
      .cHot { fill: #d9f6e6; stroke: #8dd6aa; stroke-width: 1; }
      .cGood { fill: #e3f1ff; stroke: #9cc7ee; stroke-width: 1; }
      .cMid { fill: #fff0c9; stroke: #e9c56d; stroke-width: 1; }
      .cSlow { fill: #ffe1dc; stroke: #e7a199; stroke-width: 1; }
      .cBase { fill: #eef2f7; stroke: #ccd4df; stroke-width: 1; }
      .pill { rx: 10; ry: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="54" y="58">Qwen3.6 27B KV Throughput Sweep</text>
  <text class="subtitle" x="54" y="90">Dual RTX 2080 Ti TP=2 · throughput is prefill / decode tok/s · single request</text>

  <g transform="translate(54 116)">
    <rect class="panel" x="0" y="0" width="1492" height="72" rx="16"/>
    <rect class="cHot pill" x="24" y="22" width="30" height="20"/>
    <text class="small" x="64" y="37">decode >= 80 tok/s</text>
    <rect class="cGood pill" x="245" y="22" width="30" height="20"/>
    <text class="small" x="285" y="37">70-79 tok/s</text>
    <rect class="cMid pill" x="430" y="22" width="30" height="20"/>
    <text class="small" x="470" y="37">40-69 tok/s</text>
    <rect class="cSlow pill" x="615" y="22" width="30" height="20"/>
    <text class="small" x="655" y="37">&lt; 40 tok/s</text>
    <text class="note" x="850" y="31">Read columns as workload shape:</text>
    <text class="small" x="850" y="54">PP4096/TG128 = short input + short output; PP65536/TG512 = long input + long output.</text>
  </g>

  <g transform="translate(54 220)">
    <rect class="panel" x="0" y="0" width="1492" height="700" rx="18"/>

    <text class="hdr" x="28" y="36">Checkpoint route</text>
    <text class="hdr" x="300" y="36">KV precision</text>
    <text class="hdr" x="510" y="26">noMTP</text>
    <text class="tiny" x="510" y="48">baseline decode</text>
    <text class="hdr" x="1002" y="26">MTP3</text>
    <text class="tiny" x="1002" y="48">speculative decode</text>

    <line class="grid" x1="0" y1="64" x2="1492" y2="64"/>
    <line class="grid" x1="250" y1="0" x2="250" y2="700"/>
    <line class="grid" x1="440" y1="0" x2="440" y2="700"/>
    <line class="grid" x1="932" y1="0" x2="932" y2="700"/>

    <text class="small" x="486" y="82">PP4096/TG128</text>
    <text class="small" x="710" y="82">PP65536/TG512</text>
    <text class="small" x="978" y="82">PP4096/TG128</text>
    <text class="small" x="1202" y="82">PP65536/TG512</text>

    <line class="grid" x1="440" y1="96" x2="1492" y2="96"/>
    <line class="grid" x1="674" y1="64" x2="674" y2="700"/>
    <line class="grid" x1="932" y1="64" x2="932" y2="700"/>
    <line class="grid" x1="1166" y1="64" x2="1166" y2="700"/>

    <!-- FP8 block -->
    <rect class="routeBand" x="0" y="96" width="1492" height="280"/>
    <text class="section" x="28" y="140">FP8</text>
    <text class="small" x="28" y="164">highest-quality 8-bit weight route</text>

    <g transform="translate(0 96)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">FP16</text>
      <rect class="cSlow" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1677.0 / 32.9</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cSlow" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1303.9 / 29.1</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cGood" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1614.1 / 76.0</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cGood" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1253.9 / 70.8</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <g transform="translate(0 166)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">INT8</text>
      <rect class="cSlow" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1663.0 / 33.5</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cSlow" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1274.8 / 33.7</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cGood" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1609.9 / 74.4</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cMid" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1227.9 / 42.8</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <g transform="translate(0 236)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">TQK8V4</text>
      <rect class="cSlow" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1612.1 / 30.3</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cSlow" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1277.9 / 20.7</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cGood" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1614.6 / 70.4</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cSlow" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1231.7 / 36.9</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <g transform="translate(0 306)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">TQ4NC</text>
      <rect class="cSlow" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1656.4 / 29.9</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cSlow" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1273.9 / 19.6</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cGood" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1602.8 / 71.7</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cSlow" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1227.2 / 33.6</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <!-- GPTQ block -->
    <rect class="routeBand" x="0" y="396" width="1492" height="280"/>
    <text class="section" x="28" y="440">GPTQ-INT4</text>
    <text class="small" x="28" y="464">fast 4-bit Marlin weight route</text>

    <g transform="translate(0 396)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">FP16</text>
      <rect class="cMid" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1795.5 / 50.3</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cMid" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1364.3 / 42.1</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cHot" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1732.9 / 81.7</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cHot" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1328.0 / 85.5</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <g transform="translate(0 466)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">INT8</text>
      <rect class="cMid" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1781.8 / 51.7</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cMid" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1345.8 / 52.2</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cHot" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1716.9 / 95.5</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cMid" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1290.7 / 50.1</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <g transform="translate(0 536)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">TQK8V4</text>
      <rect class="cMid" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1784.1 / 45.4</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cSlow" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1358.4 / 26.6</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cHot" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1726.0 / 94.6</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cMid" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1309.1 / 40.2</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>

    <g transform="translate(0 606)">
      <rect class="kvBand" x="250" y="0" width="190" height="70"/>
      <text class="label" x="278" y="42">TQ4NC</text>
      <rect class="cMid" x="462" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="482" y="36">1778.9 / 43.5</text>
      <text class="cellSub" x="482" y="52">noMTP · short</text>
      <rect class="cSlow" x="696" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="716" y="36">1348.4 / 24.9</text>
      <text class="cellSub" x="716" y="52">noMTP · long</text>
      <rect class="cHot" x="954" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="974" y="36">1701.9 / 88.3</text>
      <text class="cellSub" x="974" y="52">MTP3 · short</text>
      <rect class="cSlow" x="1188" y="14" width="188" height="46" rx="10"/>
      <text class="cellText" x="1208" y="36">1294.9 / 36.9</text>
      <text class="cellSub" x="1208" y="52">MTP3 · long</text>
    </g>
  </g>

  <g transform="translate(54 940)">
    <text class="note" x="0" y="0">Takeaway: MTP helps decode most on FP16/default KV; quantized KV keeps capacity but long-context decode drops, especially TurboQuant.</text>
  </g>
</svg>
