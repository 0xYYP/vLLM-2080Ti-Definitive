<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.6 27B GPTQ-INT4 KV Throughput</title>
  <desc id="desc">Grouped bar charts for prefill and decode throughput across noMTP, MTP3, four KV precision settings, and 4K/64K workloads.</desc>

  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 1; }
      .band { fill: #f1f4fa; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #141a24; }
      .subtitle { font: 500 18px Arial, Helvetica, sans-serif; fill: #526073; }
      .section { font: 700 25px Arial, Helvetica, sans-serif; fill: #172033; }
      .axis { stroke: #c6ceda; stroke-width: 1; }
      .grid { stroke: #e4e9f1; stroke-width: 1; }
      .tick { font: 500 13px Arial, Helvetica, sans-serif; fill: #737f91; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #243044; }
      .mode { font: 800 18px Arial, Helvetica, sans-serif; fill: #172033; }
      .value { font: 700 12px Arial, Helvetica, sans-serif; fill: #172033; }
      .legend { font: 600 16px Arial, Helvetica, sans-serif; fill: #334157; }
      .small { font: 500 14px Arial, Helvetica, sans-serif; fill: #667386; }
      .bar4k { fill: #2f80ed; }
      .bar64k { fill: #00a878; }
      .divider { stroke: #bec8d8; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1080"/>
  <text class="title" x="54" y="58">Qwen3.6 27B GPTQ-INT4 KV Throughput</text>
  <text class="subtitle" x="54" y="92">noMTP vs MTP3 · FP16 / INT8 / TQK8V4 / TQ4NC KV · single request</text>

